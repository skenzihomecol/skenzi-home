
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hogar | Skenzi Home</title>

    <link rel="stylesheet" href="css/hogar.css">
</head>

<body>

<!-- ENCABEZADO PRINCIPAL -->
<header class="encabezado-principal">

    <div class="barra-superior">

        <form class="buscador" id="buscador-hogar">

            <input
                type="search"
                id="buscar-producto-hogar"
                placeholder="¿Qué estás buscando?"
            >

            <button type="submit">Buscar</button>

        </form>

        <a href="carrito.html" class="carrito">
            🛒 Mi carrito
            <span id="contador-carrito">1</span>
        </a>

    </div>

    <!-- MENÚ PRINCIPAL -->
    <nav class="navegacion">

        <a href="index.html">Inicio</a>

        <div class="menu-categorias">

            <a href="#" class="enlace-categorias">
                Categorías <span>▼</span>
            </a>

            <div class="submenu-categorias">

                <a href="hogar.html">Hogar</a>
                <a href="cocina.html">Cocina</a>
                <a href="juguetes.html">Juguetes</a>
                <a href="herramientas.html">Herramientas</a>
                <a href="deporte.html">Deporte</a>
                <a href="belleza.html">Belleza</a>

            </div>

        </div>

        <a href="novedades.html">Novedades</a>

        <a href="contacto.html">Contacto</a>

    </nav>

</header>


<main>

    <!-- CATÁLOGO PRINCIPAL -->
    <section class="catalogo catalogo-hogar" id="catalogo-hogar">

        <div class="titulo">

            <span>NUESTRA COLECCIÓN</span>

            <h1 id="titulo-catalogo-hogar">
                Productos para el hogar
            </h1>

            <p>
                Encuentra detalles prácticos que transforman tus espacios.
            </p>

        </div>


        <!-- FILTROS -->
        <div class="filtros-hogar" id="filtros-hogar">

            <button
                type="button"
                class="filtro-hogar activo"
                data-categoria="todos">
                Todos
            </button>

            <button
                type="button"
                class="filtro-hogar"
                data-categoria="organizadores">
                Organizadores
            </button>

            <button
                type="button"
                class="filtro-hogar"
                data-categoria="cocina">
                Cocina
            </button>

            <button
                type="button"
                class="filtro-hogar"
                data-categoria="textiles">
                Cortinas
            </button>

        </div>


        <!-- GALERÍA DE PRODUCTOS -->
        <div id="galeria-hogar" class="productos-grid">

            <p>Cargando productos...</p>

        </div>


        <!-- VER TODOS -->
        <button
            type="button"
            id="ver-todos-hogar"
            class="boton-ver-todos">

            Ver todos los productos

        </button>

    </section>

</main>


<!-- PIE DE PÁGINA -->
<footer>

    © 2026 Skenzi Home. Todos los derechos reservados.

</footer>


<!-- CONEXIÓN Y FUNCIONAMIENTO -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/hogar.js"></script>

</body>
</html>
