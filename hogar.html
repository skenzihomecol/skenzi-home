<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skenzi Home — Sección</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<!-- 
  INSTRUCCIÓN PARA CADA PÁGINA:
  - Hogar: <body data-categoria="hogar">
  - Deporte: <body data-categoria="deporte">
  - Belleza: <body data-categoria="belleza">
  - Herramientas: <body data-categoria="herramientas">
  - Destacados: <body data-pagina="destacados">
  - Novedades: <body data-pagina="novedades">
-->
<body data-categoria="hogar">

    <!-- ENCABEZADO Y NAVEGACIÓN -->
    <header class="header-tienda">
        <div class="header-superior">
            <div class="logo">
                <h1><a href="index.html" style="color: white; text-decoration: none;">SKENZI HOME</a></h1>
            </div>

            <!-- Buscador -->
            <form class="buscador" data-busqueda>
                <input type="text" placeholder="¿Qué estás buscando?">
                <button type="submit">Buscar</button>
            </form>

            <!-- Carrito de compras -->
            <div class="contenedor-carrito-enlace">
                <a class="carrito-enlace" href="carrito.html">
                    🛒 Carrito (<span data-contador-carrito>0</span>)
                </a>
            </div>
        </div>

        <!-- Menú de navegación principal con despliegue vertical -->
        <nav aria-label="Navegación principal">
            <div class="menu">
                <div class="contenedor-categorias">
                    <button type="button" data-boton-categorias aria-expanded="false" class="btn-categorias">
                        CATEGORÍAS ▾
                    </button>
                    <div class="menu-categorias">
                        <a href="hogar.html">Hogar</a>
                        <a href="juguetes.html">Juguetes</a>
                        <a href="herramientas.html">Herramientas</a>
                        <a href="deporte.html">Deporte</a>
                        <a href="belleza.html">Belleza</a>
                    </div>
                </div>

                <a href="novedades.html">Novedades</a>
                <a href="destacados.html">Destacados</a>
                <a href="contacto.html">Contacto</a>
            </div>
        </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-container">
        <section id="productos" class="seccion-catalogo">
            <h2 id="titulo-productos">Productos de esta sección</h2>
            
            <div id="galeria-productos" class="galeria-grid">
                <p class="vacio">Cargando productos...</p>
            </div>
        </section>

        <div id="mensaje-tienda" class="mensaje-alerta" hidden></div>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>&copy; 2026 Skenzi Home. Todos los derechos reservados.</p>
    </footer>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="tienda.js"></script>
</body>
</html>
