<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skenzi Home — Carrito de Compras</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body data-pagina="carrito">

    <!-- Encabezado simple -->
    <header class="header-tienda">
        <div class="logo">
            <h1><a href="index.html" style="color: white; text-decoration: none;">SKENZI HOME</a></h1>
        </div>
    </header>

    <main class="main-container">
        <h2>Tu Carrito de Compras</h2>

        <!-- Lista de elementos del carrito -->
        <div id="lista-carrito" class="contenedor-lista-carrito">
            <p>Cargando carrito...</p>
        </div>

        <!-- Resumen y botón de pedido -->
        <div class="carrito-resumen" style="margin-top: 20px; text-align: right;">
            <h3>Total a pagar: <span id="total-carrito">$0</span></h3>
            <button type="button" id="pedido-whatsapp" class="btn-whatsapp" style="background-color: #25d366; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer;">
                Enviar pedido por WhatsApp 📱
            </button>
        </div>

        <p style="margin-top: 20px;">
            <a href="index.html">← Seguir comprando</a>
        </p>

        <!-- Mensajes de alerta -->
        <div id="mensaje-tienda" class="mensaje-alerta" hidden></div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="tienda.js"></script>
</body>
</html>
