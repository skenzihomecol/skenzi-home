
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración | Skenzi Home</title>

  <link rel="stylesheet" href="css/estilos.css">

  <style>
    .admin-contenedor {
      max-width: 1200px;
      margin: 35px auto;
      padding: 20px;
    }

    .admin-encabezado {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .admin-encabezado h1 {
      color: #555b35;
      margin: 0;
    }

    .admin-tarjetas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
      margin: 25px 0;
    }

    .admin-tarjeta {
      background: #fff;
      padding: 24px;
      border-radius: 15px;
      box-shadow: 0 4px 16px rgba(0,0,0,.07);
    }

    .admin-tarjeta h3 {
      margin-top: 0;
      color: #686d4c;
    }

    .admin-valor {
      font-size: 27px;
      font-weight: bold;
      color: #343a25;
    }

    .admin-menu {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 25px 0;
    }

    .admin-menu button,
    .admin-boton {
      border: 0;
      border-radius: 8px;
      padding: 12px 17px;
      cursor: pointer;
      background: #606844;
      color: white;
      font-weight: 600;
    }

    .admin-menu button:hover,
    .admin-boton:hover {
      background: #454b30;
    }

    .admin-seccion {
      background: #fff;
      border-radius: 15px;
      padding: 24px;
      margin: 20px 0;
      box-shadow: 0 4px 16px rgba(0,0,0,.06);
    }

    .admin-tabla {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    .admin-tabla th,
    .admin-tabla td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    .admin-tabla th {
      background: #f3f1e8;
    }

    .admin-aviso {
      padding: 15px;
      background: #f5f0df;
      border-radius: 10px;
      line-height: 1.6;
    }

    .admin-oculto {
      display: none !important;
    }

    .admin-campo {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      margin: 7px 0 15px;
      border: 1px solid #ddd;
      border-radius: 7px;
    }

    #admin-login {
      max-width: 420px;
      margin: 60px auto;
      background: white;
      border-radius: 15px;
      padding: 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    @media (max-width: 600px) {
      .admin-contenedor {
        padding: 12px;
      }

      .admin-seccion {
        padding: 15px;
        overflow-x: auto;
      }
    }
  </style>
</head>

<body>

  <main class="admin-contenedor">

    <section id="admin-login">
      <h1>Skenzi Home</h1>
      <h2>Panel administrativo</h2>
      <p>Inicia sesión para administrar tu negocio.</p>

      <form id="form-login">
        <label for="correo-admin">Correo electrónico</label>
        <input
          class="admin-campo"
          id="correo-admin"
          type="email"
          autocomplete="username"
          required
        >

        <label for="clave-admin">Contraseña</label>
        <input
          class="admin-campo"
          id="clave-admin"
          type="password"
          autocomplete="current-password"
          required
        >

        <button class="admin-boton" type="submit">
          Iniciar sesión
        </button>
      </form>

      <p id="mensaje-login" role="status"></p>
    </section>

    <section id="admin-panel" class="admin-oculto">

      <header class="admin-encabezado">
        <div>
          <h1>Skenzi Home</h1>
          <p>Panel de control del negocio</p>
        </div>
