<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skenzi Home — Tienda Principal</title>
    <!-- Vincula tus estilos CSS aquí -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body data-pagina="inicio">

    <!-- ============================================ -->
    <!-- ENCABEZADO Y NAVEGACIÓN -->
    <!-- ============================================ -->
    <header class="header-tienda">
        <div class="header-superior">
            <div class="logo">
                <h1>SKENZI HOME</h1>
            </div>

            <!-- Barra de búsqueda -->
            <form class="buscador" data-busqueda>
                <input type="text" placeholder="¿Qué estás buscando?">
                <button type="submit">Buscar</button>
            </form>

            <!-- Carrito de compras -->
            <div class="contenedor-carrito-enlace">
                <a class="carrito-enlace" href="carrito.html">
                    🛒 Carrito 
                    (<span data-contador-carrito>0</span>)
                </a>
            </div>
        </div>

        <!-- Menú de navegación principal -->
        <nav aria-label="Navegación principal">
            <div class="menu">
                
               <!-- Menú Desplegable Vertical de Categorías -->
        <div class="contenedor-categorias">
            <button type="button" data-boton-categorias aria-expanded="false" class="btn-categorias">
                CATEGORÍAS ▾
            </button>
            <div class="menu-categorias">
                <a href="hogar.html">Hogar</a>
                <a href="juguetes.html">Juguetes</a>
                <a href="herramientas.html">Herramientas</a>
                <a href="deporte.html">Deporte</a>
                <a href="belleza.html">Belleza</a>
            </div>
        </div>

        <a href="novedades.html">Novedades</a>
        <a href="contacto.html">Contacto</a>
    </div>
</nav>

                <!-- Enlaces del menú -->
                <a href="novedades.html">Novedades</a>
                <a href="contacto.html">Contacto</a>
            </div>
        </nav>
    </header>

    <!-- ============================================ -->
    <!-- CONTENIDO PRINCIPAL -->
    <!-- ============================================ -->
    <main class="main-container">
        
        <!-- Sección de Oferta del Día -->
        <section id="producto-oferta-dia" class="seccion-oferta-dia">
            <!-- Se llena dinámicamente con JS -->
        </section>

        <!-- Galería de Productos -->
        <section id="productos" class="seccion-catalogo">
            <h2 id="titulo-productos">Todos nuestros productos</h2>
            
            <!-- Contenedor donde se insertarán las tarjetas de productos -->
            <div id="galeria-productos" class="galeria-grid">
                <p class="vacio">Cargando catálogo...</p>
            </div>
        </section>

        <!-- Mensajes de notificación flotantes/sistema -->
        <div id="mensaje-tienda" class="mensaje-alerta" hidden></div>
    </main>

    <!-- ============================================ -->
    <!-- PIE DE PÁGINA -->
    <!-- ============================================ -->
    <footer>
        <p>&copy; 2026 Skenzi Home. Todos los derechos reservados.</p>
    </footer>

    <!-- ============================================ -->
    <!-- SCRIPTS (SUPABASE Y SCRIPT PRINCIPAL) -->
    <!-- ============================================ -->
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Script principal de la tienda -->
    <script src="tienda.js"></script>
</body>
</html>
