<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar contraseña | Skenzi Home</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f4f0e8;
            font-family: Arial, sans-serif;
            color: #30352b;
        }

        .contenedor {
            width: 100%;
            max-width: 430px;
            padding: 42px 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0,0,0,.08);
            text-align: center;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #465638;
        }

        .logo small {
            display: block;
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 7px;
            margin-top: 5px;
        }

        .linea {
            width: 50px;
            height: 2px;
            background: #a28b5b;
            margin: 25px auto;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 26px;
            margin-bottom: 12px;
        }

        .descripcion {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .campo {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #deded6;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #526343;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 7px;
            background: #465638;
            color: white;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #mensaje {
            margin-top: 18px;
            font-size: 13px;
            line-height: 1.5;
        }

        .volver {
            display: inline-block;
            margin-top: 25px;
            color: #526343;
            text-decoration: none;
            font-size: 13px;
        }

        .pie {
            margin-top: 30px;
            color: #999;
            font-size: 10px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <div class="logo">
            SKENZI
            <small>HOME</small>
        </div>

        <div class="linea"></div>

        <h1>Nueva contraseña</h1>

        <p class="descripcion">
            Crea una nueva contraseña para acceder
            al panel administrativo de Skenzi Home.
        </p>

        <form id="form-clave">

            <div class="campo">
                <label for="clave">Nueva contraseña</label>
                <input
                    type="password"
                    id="clave"
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Mínimo 8 caracteres"
                    required
                >
            </div>

            <div class="campo">
                <label for="confirmar-clave">Confirmar contraseña</label>
                <input
                    type="password"
                    id="confirmar-clave"
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Repite tu contraseña"
                    required
                >
            </div>

            <button type="submit" id="guardar-clave">
                GUARDAR CONTRASEÑA
            </button>

            <p id="mensaje" aria-live="polite"></p>

        </form>

        <a href="login-admin.html" class="volver">
            Volver al inicio de sesión
        </a>

        <div class="pie">
            SKENZI HOME · ADMINISTRACIÓN PRIVADA
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-admin.js"></script>

    <script>
        "use strict";

        const formulario = document.getElementById("form-clave");
        const clave = document.getElementById("clave");
        const confirmar = document.getElementById("confirmar-clave");
        const boton = document.getElementById("guardar-clave");
        const mensaje = document.getElementById("mensaje");

        const db = window.skenziAdminDB;

        formulario.addEventListener("submit", async (evento) => {

            evento.preventDefault();
            mensaje.textContent = "";

            if (!db) {
                mensaje.textContent = "No hay conexión con Supabase.";
                return;
            }

            if (clave.value.length < 8) {
                mensaje.textContent =
                    "La contraseña debe tener al menos 8 caracteres.";
                return;
            }

            if (clave.value !== confirmar.value) {
                mensaje.textContent = "Las contraseñas no coinciden.";
                return;
            }

            boton.disabled = true;
            boton.textContent = "ACTUALIZANDO...";

            try {

                const { data: sesion, error: errorSesion } =
                    await db.auth.getSession();

                if (errorSesion) throw errorSesion;

                if (!sesion.session) {
                    throw new Error(
                        "El enlace de recuperación no está activo. Solicita uno nuevo."
                    );
                }

                const { error } = await db.auth.updateUser({
                    password: clave.value
                });

                if (error) throw error;

                mensaje.style.color = "#394E3C";
                mensaje.textContent =
                    "¡Contraseña actualizada correctamente!";

                clave.value = "";
                confirmar.value = "";

                setTimeout(async () => {
                    await db.auth.signOut();
                    window.location.href = "login-admin.html";
                }, 2000);

            } catch (error) {

                console.error("Error al actualizar contraseña:", error);

                mensaje.style.color = "#A34E43";
                mensaje.textContent =
                    error.message || "No fue posible actualizar la contraseña.";

                boton.disabled = false;
                boton.textContent = "GUARDAR CONTRASEÑA";
            }

        });
    </script>

</body>
</html>
